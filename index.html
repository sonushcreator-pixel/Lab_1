<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Sign in</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #172033;
      background: radial-gradient(ellipse at 18% 15%, #e0eaff 0, transparent 38%), radial-gradient(ellipse at 85% 85%, #f0e7ff 0, transparent 35%), #f7f8fc;
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(100%, 430px);
      padding: 42px;
      border: 1px solid rgba(222, 226, 236, .8);
      border-radius: 20px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 24px 70px rgba(34, 46, 80, .12);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; font-size: 15px; font-weight: 750; letter-spacing: -.3px; }
    .mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; color: white; background: linear-gradient(135deg, #536dfe, #8b5cf6); font-size: 18px; }
    h1 { margin: 0 0 7px; font-size: 28px; letter-spacing: -1px; }
    .subtle { margin: 0 0 27px; color: #697386; }
    label { display: block; margin: 17px 0 7px; font-size: 13px; font-weight: 650; }
    .field { position: relative; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; height: 48px; padding: 0 13px; border: 1px solid #dce1ea; border-radius: 9px;
      outline: none; background: #fff; color: #172033; font: inherit; transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: #6878f5; box-shadow: 0 0 0 3px rgba(104,120,245,.14); }
    .password-input { padding-right: 68px !important; }
    .toggle { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); border: 0; padding: 5px; background: none; color: #5865d8; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
    .options { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 22px; font-size: 13px; }
    .remember { display: flex; align-items: center; gap: 8px; color: #515c70; cursor: pointer; }
    .remember input { width: 15px; height: 15px; margin: 0; accent-color: #5968e8; }
    a { color: #5362dc; text-decoration: none; font-weight: 650; }
    a:hover { text-decoration: underline; }
    button[type="submit"] { width: 100%; height: 48px; border: 0; border-radius: 9px; color: #fff; background: linear-gradient(100deg, #5968e8, #7656df); font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 8px 18px rgba(91, 98, 220, .2); transition: transform .15s, filter .15s; }
    button[type="submit"]:hover { filter: brightness(1.06); transform: translateY(-1px); }
    button:focus-visible, a:focus-visible { outline: 3px solid #aeb8ff; outline-offset: 3px; }
    .divider { display: flex; align-items: center; gap: 13px; margin: 24px 0; color: #99a1af; font-size: 12px; }
    .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: #e7e9ef; }
    .signup { margin: 0; text-align: center; color: #697386; font-size: 13px; }
    .message { min-height: 20px; margin: 12px 0 0; color: #b42318; font-size: 13px; }
    @media (max-width: 480px) { .card { padding: 30px 24px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark" aria-hidden="true">✦</span> Northstar</div>
    <h1>Welcome back</h1>
    <p class="subtle">Sign in to continue to your account.</p>
    <form id="loginForm" novalidate>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <div class="field">
        <input class="password-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="8">
        <button class="toggle" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <div class="options">
        <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
        <a href="#forgot" id="forgotLink">Forgot password?</a>
      </div>
      <button type="submit" id="submitButton">Sign in</button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
    <div class="divider">OR</div>
    <p class="signup">New to Northstar? <a href="#signup" id="signupLink">Create an account</a></p>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const password = document.getElementById('password');
    const toggle = document.getElementById('togglePassword');
    const message = document.getElementById('message');

    toggle.addEventListener('click', () => {
      const showing = password.type === 'password';
      password.type = showing ? 'text' : 'password';
      toggle.textContent = showing ? 'Hide' : 'Show';
      toggle.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
      toggle.setAttribute('aria-pressed', String(showing));
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      message.textContent = '';
      if (!form.email.validity.valid) {
        message.textContent = 'Enter a valid email address.';
        form.email.focus();
        return;
      }
      if (password.value.length < 8) {
        message.textContent = 'Your password must be at least 8 characters.';
        password.focus();
        return;
      }
      message.style.color = '#18794e';
      message.textContent = 'Ready to sign in. Connect this form to your authentication service.';
    });

    document.getElementById('forgotLink').addEventListener('click', (event) => {
      event.preventDefault();
      message.style.color = '#5362dc';
      message.textContent = 'Password reset is available through your account support team.';
    });
    document.getElementById('signupLink').addEventListener('click', (event) => {
      event.preventDefault();
      message.style.color = '#5362dc';
      message.textContent = 'Account creation is not configured yet.';
    });
  </script>
</body>
</html>
